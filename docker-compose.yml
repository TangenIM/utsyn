services:
  app:
    build: .
    image: utsyn:latest
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgres://utsyn:${POSTGRES_PASSWORD}@db:5432/utsyn
    ports:
      - "127.0.0.1:3003:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: utsyn
      POSTGRES_DB: utsyn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utsyn -d utsyn"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
